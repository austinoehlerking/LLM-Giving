name: Manual release authorization
run-name: 'Bounded authorization transport diagnostic; grants no release'
on:
  workflow_dispatch:
    inputs:
      pr:
        description: 'Open develop-to-main release PR number'
        required: true
        type: string
      sha:
        description: 'Exact QA candidate full commit SHA'
        required: true
        type: string
      digest:
        description: 'Exact closed batch SHA-256 digest'
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
  issues: write
  actions: read
  statuses: read
jobs:
  diagnostic:
    if: github.ref == 'refs/heads/codex/diagnose-manual-authorization'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # official v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Probe fixed transport routes; never authorize or deploy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/diagnose-authorization-transport.mjs
